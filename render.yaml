# Render Blueprint for Sapphire Sentinel
# Deploy: https://dashboard.render.com/blueprint

services:
  - type: web
    name: sapphire-sentinel
    runtime: docker
    repo: https://github.com/arigatoexpress/sapphire-sentinel
    branch: main
    plan: standard
    healthCheckPath: /health
    envVars:
      - key: PYTHONPATH
        value: /app/src
      - key: FLASK_ENV
        value: production
