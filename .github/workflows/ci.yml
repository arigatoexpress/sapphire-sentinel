name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,x402,deploy]"

      - name: Run type checks
        run: mypy src/sapphire_sentinel --ignore-missing-imports

      - name: Run tests with coverage
        run: pytest --cov=src/sapphire_sentinel --cov-report=xml --cov-fail-under=70

      - name: Upload coverage
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

      - name: Run ruff
        run: ruff check .

      - name: Run ruff format check
        run: ruff format --check .

  browser-smoke:
    name: browser smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,x402]"

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Browser smoke
        run: python scripts/browser_smoke.py

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@c7450ba673e133f5ee30098b3b54f444d3a2ca2d # v1

      - name: Compile contracts
        run: forge build --contracts contracts/
        continue-on-error: true

  docker:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Build Docker image
        run: docker build -t sapphire-sentinel:test .

      - name: Test Docker health
        run: |
          docker run -d -p 8098:8098 --name sentinel-test sapphire-sentinel:test
          sleep 5
          curl -f http://localhost:8098/health || exit 1
          docker stop sentinel-test
