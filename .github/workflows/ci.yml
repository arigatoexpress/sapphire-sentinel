name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,x402,deploy]"

      - name: Run type checks
        run: mypy src/sapphire_sentinel --ignore-missing-imports

      - name: Run tests with coverage
        run: pytest --cov=src/sapphire_sentinel --cov-report=xml --cov-fail-under=70

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

      - name: Run ruff
        run: ruff check .

      - name: Run ruff format check
        run: ruff format --check .

  browser-smoke:
    name: browser smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,x402]"

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Browser smoke
        run: python scripts/browser_smoke.py

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Compile contracts
        run: forge build --contracts contracts/
        continue-on-error: true

  docker:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t sapphire-sentinel:test .

      - name: Test Docker health
        run: |
          docker run -d -p 8098:8098 --name sentinel-test sapphire-sentinel:test
          sleep 5
          curl -f http://localhost:8098/health || exit 1
          docker stop sentinel-test
